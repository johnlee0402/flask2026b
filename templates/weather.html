<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氣象預報查詢</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; background-color: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        h2 { color: #333; margin-top: 0; }
        input { width: 70%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 8px 12px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        #result { margin-top: 20px; line-height: 1.6; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="card">
    <h2>天氣預報查詢</h2>
    <input type="text" id="cityInput" placeholder="例如：臺北市">
    <button onclick="getWeather()">查詢</button>

    <div id="result">
        <!-- 內容會顯示在這裡 -->
    </div>
</div>

<script>
    async function getWeather() {
        const resultDiv = document.getElementById('result');
        let city = document.getElementById('cityInput').value.trim();
        
        if (!city) {
            alert("請輸入縣市名稱");
            return;
        }

        // 模擬 Python 的 city.replace("台","臺")
        city = city.replace(/台/g, "臺");

        // 注意：這裡使用你的 API Key (請確保該 Key 在 OpenData 平台是有效的)
        const apiKey = "rdec-key-123-45678-011121314"; 
        const url = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=${apiKey}&format=JSON&locationName=${encodeURIComponent(city)}`;

        resultDiv.innerHTML = "查詢中...";

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.records.location.length === 0) {
                resultDiv.innerHTML = `<span class="error">找不到 "${city}" 的資料，請檢查拼字。</span>`;
                return;
            }

            const location = data.records.location[0];
            const weatherElement = location.weatherElement;
            
            // 取得天氣狀態與降雨機率 (對應 Python 的 index)
            const weatherStatus = weatherElement[0].time[0].parameter.parameterName;
            const rainChance = weatherElement[1].time[0].parameter.parameterName;

            resultDiv.innerHTML = `
                <strong>${location.locationName} 最新天氣預報</strong><br>
                狀態：${weatherStatus}<br>
                降雨機率：${rainChance}%
            `;

        } catch (error) {
            resultDiv.innerHTML = `<span class="error">抓取資料失敗，請確認網路或 API Key。</span>`;
            console.error(error);
        }
    }
</script>

</body>
</html>
